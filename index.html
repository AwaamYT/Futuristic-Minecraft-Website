<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Minecraft Website</title>
  <style>
    /* Full-screen background video */
    #video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      object-fit: cover;
    }
    /* Styling for the content */
    .content {
      position: relative;
      z-index: 1;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 150px;
    }
  </style>
</head>
<body>

  <!-- Video Background -->
  <iframe id="video-background" src="https://www.youtube.com/embed/MmB9b5njVbA?autoplay=1&mute=0&loop=1&playlist=MmB9b5njVbA" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
  
  <!-- Website Content -->
  <div class="content">
    <h1>Welcome to My Minecraft World</h1>
    <p>Explore mods, animations, and more!</p>
  </div>

</body>
</html>
